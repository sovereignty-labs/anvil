# nollama config for agent-host (deep-lab, LXC 203)
#
# Hardware:
#   GPU 0: RTX PRO 4000 Blackwell 24GB
#   GPU 1: RTX 5060 Ti 16GB
#   CPU:   AMD Ryzen 9 5900X, 96GB RAM
#
# Deploy:
#   cp agent-host.yaml /etc/nollama/config.yaml
#   nollama serve --config /etc/nollama/config.yaml
#
# Or via systemd:
#   systemctl start nollama

model_dir: /mnt/models/gguf

llama_server: /mnt/deeplab/llama.cpp.mainline/build/bin/llama-server

bind: 0.0.0.0:11434

autoload:
  - model: gemma-4-26B-A4B-Q5_K_S.gguf
    gpu: 0
    flags:
      ctx-size: 131072
      parallel: 4
      flash-attn: "on"
      cache-type-k: q8_0

defaults:
  flash-attn: "on"
  no-warmup: true
  jinja: true
