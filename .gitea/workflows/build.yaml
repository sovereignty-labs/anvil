name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Go
        run: |
          apk add --no-cache go git
          go version

      - name: Clone repository
        run: |
          rm -rf /src && git clone http://kit:${REGISTRY_PASSWORD}@gitea-http.gitea.svc.cluster.local:3000/kit/nollama.git /src

      - name: Download dependencies
        run: |
          cd /src
          go mod download

      - name: Run tests
        run: |
          cd /src
          go test ./...

      - name: Build binary
        run: |
          cd /src
          SHA_SHORT=$(git rev-parse --short HEAD)
          CGO_ENABLED=0 GOOS=linux go build \
            -trimpath \
            -ldflags "-s -w \
              -X github.com/hirdforge/nollama/internal/version.Version=dev \
              -X github.com/hirdforge/nollama/internal/version.Commit=${SHA_SHORT} \
              -X github.com/hirdforge/nollama/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o /src/nollama ./cmd/nollama

      - name: Verify binary
        run: |
          /src/nollama --version
          /src/nollama --help