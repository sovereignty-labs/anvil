name: Build and Push

on:
  push:
    branches: [main]

env:
  REGISTRY: gitea-http.gitea.svc.cluster.local:3000/kit/nollama
  REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  DOCKER_HOST: tcp://localhost:2375

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: apk add --no-cache docker-cli git curl

      - name: Registry login
        run: echo $REGISTRY_PASSWORD | docker login gitea-http.gitea.svc.cluster.local:3000 -u $REGISTRY_USER --password-stdin

      - name: Clone
        run: |
          rm -rf /src
          git clone http://gitea-http.gitea.svc.cluster.local:3000/kit/nollama.git /src

      - name: Test
        run: |
          curl -sL https://go.dev/dl/go1.22.12.linux-amd64.tar.gz | tar -C /usr/local -xzf -
          export PATH="/usr/local/go/bin:$PATH"
          cd /src
          go test ./...

      - name: Build and push
        run: |
          cd /src
          SHA_SHORT=$(git rev-parse --short HEAD)
          docker build \
            --build-arg VERSION=${SHA_SHORT} \
            --build-arg COMMIT=${SHA_SHORT} \
            --build-arg DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t ${REGISTRY}/nollama:sha-${SHA_SHORT} \
            -t ${REGISTRY}/nollama:latest \
            .
          docker push ${REGISTRY}/nollama:sha-${SHA_SHORT}
          docker push ${REGISTRY}/nollama:latest
