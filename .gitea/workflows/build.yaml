name: Build, Test, Push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      dind:
        image: docker:dind
        options: --privileged
    steps:
      - name: Clone repository
        run: |
          apk add --no-cache git docker-cli
          git clone --depth 1 http://gitea-http.gitea.svc.cluster.local:3000/kit/nollama.git /src

      - name: Build and test (Go)
        run: |
          apk add --no-cache go
          cd /src
          go mod download
          go test ./...

      - name: Build Docker image
        run: |
          export DOCKER_HOST=tcp://localhost:2375
          cd /src
          SHA_SHORT=$(git rev-parse --short HEAD)
          docker build \
            --build-arg VERSION=dev \
            --build-arg COMMIT=${SHA_SHORT} \
            --build-arg DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t git.hirdforge.com/kit/nollama/nollama:latest \
            -t git.hirdforge.com/kit/nollama/nollama:${SHA_SHORT} .

      - name: Push to registry
        run: |
          export DOCKER_HOST=tcp://localhost:2375
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.hirdforge.com --username kit --password-stdin
          docker push git.hirdforge.com/kit/nollama/nollama:latest
          docker push git.hirdforge.com/kit/nollama/nollama:${SHA_SHORT}
