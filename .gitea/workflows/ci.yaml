name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="$(git rev-parse --short HEAD || echo none)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -ldflags "-X github.com/hirdforge/nollama/internal/version.Version=${VERSION} \
                      -X github.com/hirdforge/nollama/internal/version.Commit=${COMMIT} \
                      -X github.com/hirdforge/nollama/internal/version.Date=${DATE}" \
            -o nollama ./cmd/nollama

      - name: Test
        run: go test ./...

      - name: Upload binary artifact
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nollama
          path: nollama
          if-no-files-found: error
