name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        run: |
          rm -rf /src
          git clone http://gitea-http.gitea.svc.cluster.local:3000/$GITHUB_REPOSITORY.git /src
          cd /src
          git checkout $GITHUB_SHA

      - name: Install Go
        run: |
          curl -sL https://go.dev/dl/go1.22.12.linux-amd64.tar.gz -o /tmp/go.tar.gz
          tar -C /usr/local -xzf /tmp/go.tar.gz
          export PATH="/usr/local/go/bin:$PATH"
          go version

      - name: Build
        run: |
          cd /src
          export PATH="/usr/local/go/bin:$PATH"
          go mod tidy
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo none)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -ldflags "-X github.com/hirdforge/nollama/internal/version.Version=${VERSION} \
                      -X github.com/hirdforge/nollama/internal/version.Commit=${COMMIT} \
                      -X github.com/hirdforge/nollama/internal/version.Date=${DATE}" \
            -o nollama ./cmd/nollama
          ./nollama --version

      - name: Test
        run: |
          cd /src
          export PATH="/usr/local/go/bin:$PATH"
          go test ./...
