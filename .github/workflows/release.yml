name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build binary
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X github.com/sovereignty-labs/anvil/internal/version.Version=${VERSION} -X github.com/sovereignty-labs/anvil/internal/version.Commit=${COMMIT} -X github.com/sovereignty-labs/anvil/internal/version.Date=${DATE}" \
            -o anvil-linux-amd64 \
            ./cmd/anvil

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: anvil-linux-amd64
          generate_release_notes: true